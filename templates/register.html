<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - ISTS</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>
  <button class="theme-button corner-button" type="button">🌙 Dark</button>

  <div class="login-page">
    <div class="card login-box">
      <img class="login-logo" src="{{ url_for('static', filename='images/logo-icon.png') }}" alt="ISTS logo">
      <h1>ISTS</h1>
      <p class="login-text">Create your staff account</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('register') }}" id="register-form">
        <div class="field">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="field">
          <label for="password">Password (at least 6 characters)</label>
          <div class="password-box">
            <input type="password" id="password" name="password" required>
            <button type="button" class="show-button">Show</button>
          </div>
        </div>

        <div class="field">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-box">
            <input type="password" id="confirm_password" name="confirm_password" required>
            <button type="button" class="show-button">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-full">Register</button>
      </form>

      <p class="bottom-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </div>
</body>
</html>
